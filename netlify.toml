# The grader is a separate site (btty-business-grader) served at
# grademe.btty.ai. It is the single canonical grader; this site keeps no grader
# code and no copy of its backend. These rules must stay ABOVE the SPA
# catch-all, because Netlify applies the first matching rule.
[[redirects]]
  from = "/scan"
  to = "https://grademe.btty.ai"
  status = 301
  force = true

[[redirects]]
  from = "/scan/*"
  to = "https://grademe.btty.ai/:splat"
  status = 301
  force = true

# The video's closing line sends people to btty.ai/call. Without this rule the
# SPA catch-all below serves the homepage for that path, so the visitor lands on
# a page with no booking on it and quietly leaves. 302 rather than 301 because
# the calendar id can change; a cached permanent redirect would strand people on
# a dead calendar with no way to fix it from our side.
[[redirects]]
  from = "/call"
  to = "https://link.btty.ai/widget/booking/ANIqkqlsUOfycji0w2QZ"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Local `netlify dev` only. Pins the ports so the dev server can coexist with
# other projects on the machine; has no effect on deploys.
[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 5199
  port = 8899
  autoLaunch = false
