<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See what BTTY builds for businesses that need more customers to find and reach them." />
    <title>BTTY | See What We Build</title>
    <style>
      :root { color: #1d2422; background: #f6f8f7; font-family: Arial, sans-serif; }
      body { margin: 0; }
      main { min-height: 100vh; box-sizing: border-box; padding: 48px 24px 80px; }
      .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
      .logo { margin-bottom: 40px; color: #38aaa3; font-size: 14px; font-weight: 900; letter-spacing: .28em; text-decoration: none; }
      .logo span { color: #1d2422; }
      video { display: block; width: 100%; border: 1px solid #dfe6e3; border-radius: 16px; background: #000; box-shadow: 0 20px 50px rgba(29,36,34,.12); }
      .actions { width: 100%; margin-top: 32px; text-align: center; }
      .primary { display: inline-block; padding: 16px 32px; border-radius: 999px; background: #38aaa3; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
      .secondary { margin-top: 24px; color: #68736f; font-size: 14px; }
      .secondary a { display: inline-block; margin-top: 8px; color: #25928b; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <a class="logo" href="/">BTTY<span>.AI</span></a>
        <video controls playsinline preload="metadata" poster="/btty-video-poster.jpg">
          <source src="/btty-nurture.mp4" type="video/mp4" />
          <track kind="captions" src="/btty-nurture-captions.srt" srcLang="en" label="English captions" default />
          Your browser does not support the video tag.
        </video>
        <div class="actions">
          <a class="primary" href="https://link.btty.ai/widget/booking/ANIqkqlsUOfycji0w2QZ">Book twenty minutes</a>
          <div class="secondary">
            If you already know you want it, you can start right here without talking to me.<br />
            <a href="https://link.fastpaydirect.com/payment-link/6a620ab5a655fa0b802a5c31">Start now</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
